<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BloqueoLab</title>
<meta name="description" content="Consulta de anestesia regional: anatomía de plexos, sonoanatomía, calculadora de anestésicos locales, LAST y anticoagulación.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Concepto: atlas de bolsillo para la sala. Barra superior con buscador, pestañas por herramienta,
   fichas en una columna legible y paneles de ecografía oscuros como la pantalla del ecógrafo.
   Color: tinta verde-quirófano, amarillo "nervio" de los atlas, rojo arterial y azul venoso. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e7ecea; --ink:#14211e; --muted:#566662; --line:#d2dad7;
  --accent:#1c6b57; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --nerve:#d99a00; --nerve-soft:#f7e7bb; --nerve-ink:#6e4b00;
  --artery:#c0392b; --vein:#2e5ea8; --bone-band:#e9e3d4;
  --ok:#2c8a4e; --warn:#b97c00; --crit:#bf3a2c; --ok-soft:#dff0e5; --warn-soft:#f8ecd0; --crit-soft:#f7dedb;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,33,30,.06),0 4px 14px rgba(20,33,30,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1c2725; --ink:#e3ebe8; --muted:#94a6a0; --line:#2a3734;
  --accent:#5cc2a0; --accent-ink:#0b1513; --accent-soft:#1b3a31;
  --nerve:#f0bd3c; --nerve-soft:#3d3214; --nerve-ink:#f4cd63;
  --artery:#e5685a; --vein:#729ce2; --bone-band:#2a2a22;
  --ok:#5cc58a; --warn:#e6b23e; --crit:#ee7b6c; --ok-soft:#173326; --warn-soft:#3a2f12; --crit-soft:#3d1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#141c1a; --surface-2:#1c2725; --ink:#e3ebe8; --muted:#94a6a0; --line:#2a3734;
  --accent:#5cc2a0; --accent-ink:#0b1513; --accent-soft:#1b3a31;
  --nerve:#f0bd3c; --nerve-soft:#3d3214; --nerve-ink:#f4cd63;
  --artery:#e5685a; --vein:#729ce2; --bone-band:#2a2a22;
  --ok:#5cc58a; --warn:#e6b23e; --crit:#ee7b6c; --ok-soft:#173326; --warn-soft:#3a2f12; --crit-soft:#3d1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0 0 .7em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand b span{color:var(--accent)}
.brand svg{width:26px;height:26px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px 0 36px}
.search>svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
.results button:hover,.results button.on{background:var(--surface-2)}
.results small{display:block;color:var(--muted);font-size:12px}
.icon-btn{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;text-decoration:none}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{background:var(--ink);color:var(--bg)}

/* ---------- estructura ---------- */
main{padding-block:20px 40px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip .mono{font-size:11.5px;color:var(--muted);margin-left:4px}
.hero{display:grid;gap:10px;margin-bottom:22px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.hero h1{font-size:clamp(30px,5.4vw,46px);font-weight:800;letter-spacing:-.015em}
.hero .range{font-family:var(--f-mono);font-weight:600;font-size:15px;background:var(--nerve-soft);color:var(--nerve-ink);padding:2px 10px;border-radius:6px;vertical-align:middle;margin-left:8px;letter-spacing:0;font-stretch:100%}
.lede{font-size:16.5px;max-width:68ch;margin:0}
.variant{font-size:14px;color:var(--muted);max-width:68ch;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card+.card,.stack>*+*{margin-top:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{font-size:20px;font-weight:700}
.card-h p{margin:0;color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:28px 0 10px}

/* ---------- texto de contenido ---------- */
.prose{max-width:72ch}
.prose ul{padding-left:1.2em;margin:.2em 0 .8em}
.prose li{margin:.25em 0}
.prose h4{font-size:15px;margin:.2em 0 .5em}
.perla{border-left:3px solid var(--nerve);background:var(--nerve-soft);padding:9px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14.5px}
.nota{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t thead th{background:var(--surface-2);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.t tr:last-child td{border-bottom:0}
table.t.compact td{padding:5px 8px}
details.sec{border-top:1px solid var(--line)}
details.sec:last-child{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:88%;font-size:19px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:20px}
details.sec[open]>summary::after{content:"–"}
details.sec>div{padding-bottom:14px}
.qa details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.qa summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:10px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"P";font-family:var(--f-mono);color:var(--accent);font-weight:600}
.qa details>div{padding:0 14px 12px 34px;color:var(--ink)}
.refs{font-size:13px;color:var(--muted);padding-left:1.2em}
.refs li{margin:.35em 0}

/* ---------- esquema braquial ---------- */
.diagram-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.diagram-scroll svg{min-width:640px;width:100%;height:auto;display:block}
.bp .edge{fill:none;stroke:var(--line);stroke-width:2.2}
.bp .edge.lit{stroke:var(--nerve);stroke-width:4}
.bp .node-r circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.bp .node-r text,.bp .node-p text{font-family:var(--f-mono);font-size:12px;font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.bp .node-p rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.bp .node-p text{font-family:var(--f-body);font-size:11.5px}
.bp .lit circle,.bp .lit rect{fill:var(--nerve);stroke:var(--nerve)}
.bp .node-r.lit text,.bp .node-p.lit text{fill:#1d1600}
.bp .div circle{fill:var(--muted)}
.bp .div.lit circle{fill:var(--nerve)}
.bp .div text{font-size:10px;fill:var(--muted);font-family:var(--f-mono)}
.bp .term{cursor:pointer}
.bp .term circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.bp .term text{font-size:13px;font-weight:600;fill:var(--ink);dominant-baseline:central}
.bp .term:hover text{fill:var(--accent)}
.bp .term.lit circle{fill:var(--nerve);stroke:var(--nerve)}
.bp .term.sel text{fill:var(--nerve-ink)}
.bp .stub line,.bp .stub path{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:3 3}
.bp .stub circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.3}
.bp .stub text{font-size:11px;fill:var(--muted);font-weight:600}
.bp .stub.lit line,.bp .stub.lit path{stroke:var(--nerve);stroke-dasharray:none;stroke-width:2.4}
.bp .stub.lit circle{fill:var(--nerve);stroke:var(--nerve)}
.bp .stub.lit text{fill:var(--nerve-ink)}
.bp .stub{cursor:pointer}
.bp .stub path.hit{stroke:transparent!important;stroke-width:16!important;stroke-dasharray:none!important;pointer-events:stroke}
.bp .stub text{pointer-events:all}
.bp .colh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;fill:var(--muted);font-weight:700;text-anchor:middle}
.bp .clav{fill:var(--bone-band)}
.bp .clavt{font-size:10.5px;fill:var(--muted);text-anchor:middle;font-style:italic}
.bp .band{fill:var(--accent);opacity:.12;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:6 4}
.bp .bandt{font-size:11.5px;font-weight:700;fill:var(--accent)}
.bp .st-si circle{fill:var(--nerve)!important;stroke:var(--nerve)!important}
.bp .st-par circle{fill:var(--nerve-soft)!important;stroke:var(--warn)!important;stroke-dasharray:3 2}
.bp .st-no circle{fill:var(--surface-2)!important;stroke:var(--line)!important}
.bp .st-no text{fill:var(--muted)!important;opacity:.7}
.swipe{display:none;font-size:12px;color:var(--muted);margin:-4px 0 6px}
@media (max-width:700px){.swipe{display:block}}
.levels{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.lvl{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13.5px;cursor:pointer}
.lvl.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg-si{background:var(--nerve)}
.lg-par{background:var(--nerve-soft);border:1.5px dashed var(--warn)}
.lg-no{background:var(--surface-2);border:1px solid var(--line)}
.level-info{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));margin-top:14px}
.level-info>*{min-width:0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:0;font-size:14.5px}
.kv dt{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{padding-top:6px}}

/* ---------- ficha de nervio ---------- */
.ficha{border:1px solid var(--nerve);background:linear-gradient(var(--nerve-soft),var(--nerve-soft)) top/100% 4px no-repeat,var(--surface);border-radius:12px;padding:14px 16px;margin-top:14px}
.ficha-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ficha-h h3{font-size:22px;font-weight:800}
.ficha-h .x{margin-left:auto}
.roots{display:flex;gap:4px;flex-wrap:wrap}
.root{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--nerve);color:#1d1600}
.root.m{background:transparent;border:1px dashed var(--nerve);color:var(--nerve-ink)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ficha .clin{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:14.5px}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:14px;margin-top:14px;text-align:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:hover{border-color:var(--accent)}

/* ---------- mapa de raíces ---------- */
.rmap{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.rmap th{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);padding:4px 2px 8px;text-align:center}
.rmap th button{background:none;border:0;cursor:pointer;font:inherit;color:inherit;padding:3px 5px;border-radius:5px}
.rmap th button.on{background:var(--ink);color:var(--bg)}
.rmap td{padding:3px 2px;text-align:center}
.rmap td.n{text-align:left;padding-right:10px;min-width:0}
.rmap td.n button{background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.rmap td.n button:hover{color:var(--accent)}
.rmap td.n small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.rmap .c{display:block;height:20px;border-radius:4px;background:var(--surface-2);min-width:22px}
.rmap .c.on{background:var(--nerve)}
.rmap .c.mi{background:repeating-linear-gradient(135deg,var(--nerve) 0 3px,transparent 3px 6px);outline:1px solid var(--nerve);outline-offset:-1px}
.rmap tr.dim{opacity:.28}
.rmap tr.sel td.n button{color:var(--nerve-ink)}
.rmap tr.sel .c.on{box-shadow:0 0 0 2px var(--ink) inset}

/* ---------- ecografía ---------- */
.eco{background:#0a0c0d;border-radius:12px;overflow:hidden;border:1px solid #23292b}
.eco svg{display:block;width:100%;height:auto}
.eco-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eco-card h3{font-size:17px;font-weight:700;margin-bottom:4px}
.eco-card .sonda{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.eco-card .claves{font-size:14px;margin-top:10px}

/* ---------- calculadoras ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%;min-width:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.field select{font-family:var(--f-body)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:40px}
.seg button{flex:1;border:0;background:var(--surface);cursor:pointer;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--ink);color:var(--bg)}
.derived{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.derived b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.out{margin-top:14px;border-radius:12px;background:var(--surface-2);padding:14px}
.recipe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px}
.big{font-family:var(--f-mono);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.recipe .plus{color:var(--muted);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.err{color:var(--crit);font-weight:600;font-size:14px}
.plan{width:100%;border-collapse:collapse;font-size:14px}
.plan th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.plan td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.plan input,.plan select{height:36px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;width:100%;min-width:0;font-family:var(--f-mono)}
.plan select{font-family:var(--f-body)}
.plan .num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.plan-wrap{overflow-x:auto}
.plan-wrap table{min-width:660px}
.gauge{height:14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;position:relative}
.gauge span{height:100%}
.gauge .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.totals{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.badge-ej{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:1px 6px}

/* ---------- LAST ---------- */
.last-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:12px}
.dose{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.dose small{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dose .big{color:var(--crit)}
.dose p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-weight:600;width:28px;height:28px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;font-size:13px}
.steps b{display:block}
.alert-band{background:var(--crit-soft);border:1px solid var(--crit);border-radius:12px;padding:12px 14px;color:var(--ink)}

/* ---------- anticoagulación ---------- */
.ac td:first-child{font-weight:600;min-width:180px}
.tbl>table.t:not(.compact):not(.ac){min-width:520px}
@media (max-width:640px){
  table.ac thead{display:none}
  table.ac tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  table.ac tr:last-child{border-bottom:0}
  table.ac td{border:0;padding:0;min-width:0}
  table.ac td:first-child,table.ac td:last-child{grid-column:1/-1}
  table.ac td[data-l]::before{content:attr(data-l);display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  table.ac td:last-child:empty{display:none}
}
.new{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}

/* ---------- temas ---------- */
.temas{display:grid;gap:10px}
.tema{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tema .n{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:30px;line-height:1;color:var(--muted)}
.tema.listo .n{color:var(--accent)}
.tema h3{font-size:17px;font-weight:700;margin-bottom:6px}
.tema .bl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tema .bl span{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}

/* ---------- fichas de bloqueo ---------- */
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:10px}
.bcard{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.bcard:hover{border-color:var(--accent)}
.bcard b{font-family:var(--f-display);font-stretch:88%;font-size:18px;line-height:1.2}
.bcard span.d{font-size:13px;color:var(--muted)}
.bcard .pills{display:flex;gap:6px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.quick>div{background:var(--surface);padding:11px 13px;min-width:0;box-shadow:1px 1px 0 var(--line)}
.quick small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.quick .v{font-size:14.5px}
.quick .vol{background:var(--nerve-soft)}
.terr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:12px}
.terr>div{border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.terr small{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.terr .t-si{background:var(--ok-soft)} .terr .t-si small{color:var(--ok)}
.terr .t-no{background:var(--surface-2)} .terr .t-no small{color:var(--muted)}
.terr .t-fr{border:1px solid var(--line)}
.terr .t-fr.alto{background:var(--crit-soft);border-color:transparent} .terr .t-fr.alto small{color:var(--crit)}
.terr .t-fr.moderado{background:var(--warn-soft);border-color:transparent} .terr .t-fr.moderado small{color:var(--warn)}
.terr .t-fr.bajo small,.terr .t-fr.nulo small{color:var(--ok)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.imgs a{display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.imgs a:hover{border-color:var(--accent)}
.imgs a b{font-size:14px}
.imgs a span{font-size:12.5px;color:var(--muted)}
.imgs a i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;margin-bottom:12px}
.figs figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.figs img{display:block;width:100%;height:auto;background:#0a0c0d}
.figs figcaption{padding:10px 12px;font-size:13.5px;display:grid;gap:3px}
.figs figcaption .src{font-size:12px;color:var(--muted)}
.figs figcaption .src a{color:var(--muted)}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-bottom:12px}
.crumbs a{text-decoration:none;font-weight:600}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.cmp td{font-size:13.5px}
.cmp td .pill{white-space:nowrap}
.sibs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
footer{border-top:1px solid var(--line);padding-block:18px 28px;font-size:12.5px;color:var(--muted)}
footer p{margin:.3em 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion:no-preference){.bp .edge,.bp circle,.bp rect{transition:fill .2s,stroke .2s,stroke-width .2s}}
</style>
</head>
<body>
<!-- Patrones compartidos para los paneles de ecografía -->

  <defs>

      <stop offset="0" stop-color="#2a2f31"/><stop offset=".55" stop-color="#15181a"/><stop offset="1" stop-color="#08090a"/>
    </radialGradient>

      <stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset=".25" stop-color="#000" stop-opacity=".95"/><stop offset="1" stop-color="#000"/>

</svg>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#braquial" aria-label="BloqueoLab, inicio">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22 C 9 22, 10 10, 16 10 S 23 22, 29 22" fill="none" stroke="var(--nerve)" stroke-width="3.2" stroke-linecap="round"/><circle cx="16" cy="10" r="3.4" fill="var(--accent)"/><circle cx="7.5" cy="18.6" r="1.8" fill="var(--ink)"/><circle cx="24.5" cy="18.6" r="1.8" fill="var(--ink)"/></svg>
        <b>Bloqueo<span>Lab</span></b>
      </a>
      <div class="search" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Buscar nervio, bloqueo, fármaco…" autocomplete="off" aria-label="Buscar">
        <div class="results" id="results" hidden></div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema claro u oscuro" title="Tema">

<main class="wrap" id="main"></main>

<footer class="wrap">

<script src="contenido.js"></script>
<script>
(function(){
"use strict";
const D = window.BLOQUEOLAB;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmt = (n, d=1) => (isFinite(n) ? n : 0).toLocaleString("es-CO",{maximumFractionDigits:d, minimumFractionDigits:0});
const main = $("#main");
if (!D) { main.innerHTML = '<div class="card"><h2>No se encontró contenido.js</h2><p>Sube contenido.js a la misma carpeta que esta página.</p></div>'; return; }
$("#ver").textContent = D.version;

/* ------------------------------ estado ------------------------------ */
const KEY = "bloqueolab.v1";
const S = {
  tab: "anatomia", sub: "braquial", nervio: null, nivel: null, filtroRaiz: null,
  eco: { doppler: true, nervios: true, aguja: true, etiquetas: true },
  pac: { peso: 70, talla: 170, sexo: "M", modo: "idealmin" },
  dil: { f: "ropi", ci: 0.75, cf: 0.375, vf: 20, epi: 0 },
  plan: [
    { b: "Supraclavicular", f: "ropi", c: 0.5, v: 20, epi: false },
    { b: "Infiltración de piel", f: "lido", c: 1, v: 5, epi: false }
  ],
  ejemplo: true, acq: ""
};
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); ["eco","pac","dil"].forEach(k => o[k] && Object.assign(S[k], o[k])); if (Array.isArray(o.plan)) S.plan = o.plan; if (typeof o.ejemplo === "boolean") S.ejemplo = o.ejemplo; } } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({eco:S.eco, pac:S.pac, dil:S.dil, plan:S.plan, ejemplo:S.ejemplo})); } catch(e) {} }
try { const t = localStorage.getItem(KEY+".theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch(e) {}
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nxt);
  try { localStorage.setItem(KEY+".theme", nxt); } catch(e) {}
});

/* ------------------------------ rutas ------------------------------ */
const ANAT = ["bases","braquial","cervical","lumbar","sacro","articulaciones"];
const TABS = [["anatomia","Anatomía"],["bloqueos","Bloqueos"],["calculadora","Calculadora"],["last","LAST"],["anticoagulacion","Anticoagulación"]];
function parseHash(){
  const h = (location.hash || "").replace("#","");
  if (ANAT.includes(h)) { S.tab = "anatomia"; S.sub = h; }
  else if (h === "anatomia") { S.tab = "anatomia"; }
  else if (TABS.some(t => t[0] === h)) { S.tab = h; S.bloque = null; }
  else if (h.startsWith("b-") && D.bloqueos.some(b => b.id === h.slice(2))) { S.tab = "bloqueos"; S.bloque = h.slice(2); }
  else if (/^tema-\d+$/.test(h)) { S.tab = "bloqueos"; S.bloque = null; S.tema = +h.slice(5); }
  if (h === "bloqueos") S.tema = null;
}
function nav(token, keep){
  if (!keep) { S.nervio = null; S.nivel = null; S.filtroRaiz = null; }
  if (location.hash === "#"+token) { parseHash(); render(); } else { location.hash = token; }
}
window.addEventListener("hashchange", () => { S.filtroRaiz = null; S.tema = null; S.bloque = null; if (!pendingNerve) S.nervio = null; if (!pendingLevel) S.nivel = null; parseHash(); render(); window.scrollTo({top:0}); });

/* ------------------------------ helpers ------------------------------ */
const plexo = id => D.anatomia.plexos.find(p => p.id === id);
function allNervios(){ const out=[]; D.anatomia.plexos.forEach(p => p.nervios.forEach(n => out.push({p, n}))); return out; }
function rango(arr){ if (!arr || !arr.length) return ""; return arr.length === 1 ? arr[0] : arr[0] + "–" + arr[arr.length-1]; }
function refsHTML(keys){ if (!keys || !keys.length) return ""; return `<div class="section-title">Referencias</div><ol class="refs">${keys.map(k => `<li>${esc(D.referencias[k] || k)}</li>`).join("")}</ol>`; }
function qaHTML(list){ if (!list || !list.length) return ""; return `<div class="section-title">Preguntas para la defensa</div><div class="qa">${list.map(x => `<details><summary>${esc(x.q)}</summary><div>${esc(x.a)}</div></details>`).join("")}</div>`; }
function seccionesHTML(list){ return `<div>${list.map((s,i) => `<details class="sec" ${i<2?"open":""}><summary>${esc(s.titulo)}</summary><div class="prose">${s.html.replace(/<table class="t/g,'<div class="tbl"><table class="t').replace(/<\/table>/g,"</table></div>")}</div></details>`).join("")}</div>`; }

/* ------------------------------ pestañas ------------------------------ */
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([id,l]) => `<a class="tab ${S.tab===id?"on":""}" href="#${id==="anatomia"?S.sub:id}" ${S.tab===id?'aria-current="page"':""}>${l}</a>`).join("");
}

/* ============================== ANATOMÍA ============================== */
function subnavHTML(){
  const items = [["bases","Bases",""], ...D.anatomia.plexos.map(p => [p.id, p.nombre.replace("Plexo ",""), p.rango]), ["articulaciones","Articulaciones",""]];
  return `<div class="subnav" role="tablist">${items.map(([id,l,r]) => `<a class="chip ${S.sub===id?"on":""}" href="#${id}">${esc(l.charAt(0).toUpperCase()+l.slice(1))}${r?`<span class="mono">${esc(r)}</span>`:""}</a>`).join("")}</div>`;
}

function viewAnatomia(){
  let body = "";
  if (S.sub === "bases") body = viewBases();
  else if (S.sub === "articulaciones") body = viewArticulaciones();
  else body = viewPlexo(plexo(S.sub) || plexo("braquial"));
  return subnavHTML() + body;
}

function viewBases(){
  const b = D.anatomia.bases;
  return `<div class="hero"><div class="eyebrow">Tema 1 · Anatomía</div><h1>${esc(b.titulo)}</h1><p class="lede">${esc(b.intro)}</p></div>
  <div class="card">${seccionesHTML(b.secciones.map((s,i)=>s))}</div>
  ${qaHTML(b.preguntas)}${refsHTML(b.refs)}`;
}

function viewArticulaciones(){
  const a = D.anatomia.articulaciones;
  return `<div class="hero"><div class="eyebrow">Tema 1 · Anatomía aplicada</div><h1>${esc(a.titulo)}</h1><p class="lede">${esc(a.intro)}</p></div>
  <div class="card"><div class="tbl"><table class="t"><thead><tr><th>Articulación</th><th>Nervios</th><th>Bloqueos que la cubren</th><th>Tema</th></tr></thead><tbody>
  ${a.filas.map(f => `<tr><td><b>${esc(f.art)}</b></td><td>${esc(f.nervios)}</td><td>${esc(f.bloqueos)}</td><td class="mono">${f.tema}</td></tr>`).join("")}
  </tbody></table></div></div>${refsHTML(a.refs)}`;
}

function viewPlexo(p){
  const ecos = p.id === "braquial" ? [] : (D.anatomia.ecoPorPlexo[p.id] || []);
  let diagram = "";
  if (p.id === "braquial") diagram = braquialCard(p);
  else if (p.id === "cervical") diagram = `<div class="card"><div class="card-h"><h2>Ramas superficiales</h2><p>Toca una rama para ver su ficha</p></div><div class="diagram-scroll" style="overflow:visible">${cervicalSVG(p)}</div></div>`;
  return `<div class="hero"><div class="eyebrow">Tema 1 · Anatomía</div>
    <h1>${esc(p.nombre)}<span class="range">${esc(p.rango)}</span></h1>
    <p class="lede">${esc(p.resumen)}</p>${p.variante?`<p class="variant">${p.variante}</p>`:""}</div>
  ${diagram}
  <div class="card" id="mapa"><div class="card-h"><h2>Mapa de raíces</h2><p>Toca un segmento para filtrar · toca un nervio para su ficha</p></div>
    <div id="rmapBox">${rmapHTML(p)}</div><div id="fichaBox">${p.id==="braquial" ? "" : fichaHTML(p)}</div></div>
  ${ecos.length ? `<div class="section-title">Sonoanatomía</div><div class="grid2">${ecos.map(id => ecoCard(id)).join("")}</div>` : ""}
  <div class="section-title">Contenido</div>
  <div class="card">${seccionesHTML(p.secciones)}</div>
  ${qaHTML(p.preguntas)}${refsHTML(p.refs)}`;
}

/* ---------- ficha ---------- */
function fichaHTML(p){
  const n = S.nervio && p.nervios.find(x => x.id === S.nervio);
  if (!n) return `<div class="empty">Toca un nervio en el ${p.id==="braquial"?"esquema":"mapa"} para ver su origen, territorio y cómo se encuentra en el bloqueo.</div>`;
  const roots = n.raices.map(r => `<span class="root">${r}</span>`).join("") + (n.raicesMenor||[]).map(r => `<span class="root m" title="Aporte menor o inconstante">${r}</span>`).join("");
  const row = (k,v) => v && v !== "—" ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  return `<div class="ficha" id="ficha"><div class="ficha-h"><h3>${esc(n.nombre)}</h3><div class="roots">${roots}</div><span class="tag">${esc(n.tipo)}</span><button class="btn ghost x" data-act="cerrar-ficha" aria-label="Cerrar ficha">Cerrar</button></div>
  <dl class="kv">${row("Origen",n.origen)}${row("Motor",n.motor)}${row("Sensitivo",n.sensitivo)}${row("Articular",n.articular)}</dl>
  <div class="clin">${n.clinica && n.clinica!=="—" ? `<div><b>En el bloqueo.</b> ${esc(n.clinica)}</div>`:""}${n.eco && n.eco!=="—" ? `<div><b>En el eco.</b> ${esc(n.eco)}</div>`:""}</div></div>`;
}

/* ---------- mapa de raíces ---------- */
function rmapHTML(p){
  const segs = p.segmentos;
  return `<div style="overflow-x:auto"><table class="rmap"><thead><tr><th style="text-align:left">Nervio</th>${segs.map(s => `<th><button data-act="raiz" data-v="${s}" class="${S.filtroRaiz===s?"on":""}" aria-pressed="${S.filtroRaiz===s}">${s}</button></th>`).join("")}</tr></thead><tbody>
  ${p.nervios.map(n => {
    const has = s => n.raices.includes(s) || (n.raicesMenor||[]).includes(s);
    const dim = S.filtroRaiz && !has(S.filtroRaiz);
    return `<tr class="${dim?"dim":""} ${S.nervio===n.id?"sel":""}"><td class="n"><button data-act="nervio" data-v="${n.id}">${esc(n.nombre)}<small>${esc(n.origen)}</small></button></td>${segs.map(s => `<td><span class="c ${n.raices.includes(s)?"on":(n.raicesMenor||[]).includes(s)?"mi":""}" title="${s}"></span></td>`).join("")}</tr>`;
  }).join("")}</tbody></table></div>
  <div class="legend"><span><i class="lg-si" style="border-radius:3px"></i>Aporte principal</span><span><i class="lg-par" style="border-radius:3px"></i>Aporte menor o inconstante</span></div>`;
}

/* ---------- esquema del plexo braquial ---------- */
const BP = {
  N: {
    C5:{x:80,y:62,k:"r"}, C6:{x:80,y:122,k:"r"}, C7:{x:80,y:182,k:"r"}, C8:{x:80,y:242,k:"r"}, T1:{x:80,y:302,k:"r"},
    TS:{x:215,y:92,k:"p",l:"Superior"}, TM:{x:215,y:182,k:"p",l:"Medio"}, TI:{x:215,y:272,k:"p",l:"Inferior"},
    DSA:{x:335,y:74,k:"d",l:"a"}, DSP:{x:335,y:108,k:"d",l:"p"}, DMA:{x:335,y:168,k:"d",l:"a"}, DMP:{x:335,y:198,k:"d",l:"p"}, DIA:{x:335,y:258,k:"d",l:"a"}, DIP:{x:335,y:290,k:"d",l:"p"},
    CL:{x:455,y:92,k:"p",l:"Lateral"}, CP:{x:455,y:187,k:"p",l:"Posterior"}, CM:{x:455,y:282,k:"p",l:"Medial"},
    musculocutaneo:{x:620,y:48,k:"t",l:"Musculocutáneo"}, mediano:{x:620,y:132,k:"t",l:"Mediano"}, axilar:{x:620,y:200,k:"t",l:"Axilar"}, radial:{x:620,y:250,k:"t",l:"Radial"}, cubital:{x:620,y:318,k:"t",l:"Cubital"}
  },

/* ============================== ECOGRAFÍA ============================== */
function ecoSVG(id){
  const E = D.anatomia.eco[id]; if (!E) return "";
  const o = S.eco, W = 320, H = 220;
  const q = p => `M${p[0][0]} ${p[0][1]} Q ${p[1][0]} ${p[1][1]} ${p[2][0]} ${p[2][1]}`;
  const ell = (e, extra="") => `<ellipse cx="${e[0]}" cy="${e[1]}" rx="${e[2]}" ry="${e[3]}" ${extra}/>`;
  let mus="", fas="", bone="", ves="", ner="", top="";
  E.el.forEach(x => {
    const rot = x.rot ? `transform="rotate(${x.rot} ${x.e[0]} ${x.e[1]})"` : "";
    if (x.t === "musculo") mus += ell(x.e, `fill="url(#striae)" stroke="#6d767a" stroke-width=".9" ${rot}`);
    else if (x.t === "fascia") fas += `<path d="${q(x.p)}" fill="none" stroke="#d6dadc" stroke-width="1.5" opacity=".85"/>`;
    else if (x.t === "hueso") { const [a,,c] = x.p; bone += `<path d="${q(x.p)} L ${c[0]} ${H} L ${a[0]} ${H} Z" fill="url(#shadow)"/><path d="${q(x.p)}" fill="none" stroke="#f4f4f1" stroke-width="3.4" stroke-linecap="round"/>`; }
    else if (x.t === "pleura") { const [a,,c] = x.p; bone += `<path d="${q(x.p)} L ${c[0]} ${H} L ${a[0]} ${H} Z" fill="url(#lung)"/><path d="${q(x.p)}" fill="none" stroke="#eceeef" stroke-width="2.2"/>` + [22,44].map(dy => `<path d="${q(x.p.map(pt=>[pt[0],pt[1]+dy]))}" fill="none" stroke="#cfd3d5" stroke-width="1.2" opacity="${dy===22?.35:.2}"/>`).join(""); }
    else if (x.t === "arteria") ves += `<circle cx="${x.c[0]}" cy="${x.c[1]}" r="${x.c[2]}" fill="${o.doppler?"#c0392b":"#050607"}" stroke="#9aa1a5" stroke-width="1"/>` + (o.doppler?`<circle cx="${x.c[0]}" cy="${x.c[1]}" r="${x.c[2]*.55}" fill="#e8743a" opacity=".55"/>`:"");
    else if (x.t === "vena") ves += ell(x.e, `fill="${o.doppler?"#2e5ea8":"#060708"}" stroke="#7f878b" stroke-width=".8"`);
    else if (x.t === "nervio") {
      const hi = o.nervios, panal = x.s === "panal";
      const fill = panal ? (hi ? "url(#honeyHi)" : "url(#honey)") : (hi ? "#3a3010" : "#111315");
      const stroke = hi ? "#f2bf3a" : (panal ? "#d4d8da" : "#c4c9cc");
      ner += x.c ? `<circle cx="${x.c[0]}" cy="${x.c[1]}" r="${x.c[2]}" fill="${fill}" stroke="${stroke}" stroke-width="${hi?1.6:1.1}"/>` : ell(x.e, `fill="${fill}" stroke="${stroke}" stroke-width="${hi?1.6:1.1}"`);
    }
    else if (x.t === "vaina") ner += ell(x.e, `fill="none" stroke="#dfe3e5" stroke-width="1.1" stroke-dasharray="4 3"`);
    else if (x.t === "difusion" && o.aguja) top += ell(x.e, `fill="#000" opacity=".88" stroke="#ffffff" stroke-opacity=".18"`);
    else if (x.t === "aguja" && o.aguja) { const [x1,y1,x2,y2] = x.a; top += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="5" opacity=".18" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fbfbfb" stroke-width="2" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="2.6" fill="#fff"/>`; }
  });
  let lab = "";
  if (o.etiquetas) (E.etiquetas||[]).forEach(l => {
    const [ax, ay] = l.a, anchor = l.an || (l.x < 110 ? "start" : l.x > 210 ? "end" : "middle");
    const tx = l.x, ty = l.y;
    lab += `<line x1="${ax}" y1="${ay}" x2="${tx}" y2="${ty + (ty < ay ? 3 : -9)}" stroke="#e9eced" stroke-width=".7" opacity=".55"/><circle cx="${ax}" cy="${ay}" r="1.6" fill="#e9eced"/>`;
    lab += `<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-family="Public Sans, system-ui, sans-serif" font-size="9.6" font-weight="600" fill="#eef1f2" stroke="#0a0c0d" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">${esc(l.txt)}</text>`;
  });
  let ruler = "";
  if (E.prof){ const step = H / E.prof; for (let i=1;i<E.prof;i++){ const y = i*step; ruler += `<line x1="${W-6}" y1="${y}" x2="${W}" y2="${y}" stroke="#9aa1a5" stroke-width="1"/>`; if (E.prof <= 6 || i % 2 === 0) ruler += `<text x="${W-9}" y="${y+3}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#8b9295">${i}</text>`; } }
  const axes = `<text x="6" y="${H-6}" font-family="Public Sans, system-ui, sans-serif" font-size="8.5" fill="#9aa1a5">◂ ${esc(E.ejes[0])}</text><text x="${W-22}" y="${H-6}" text-anchor="end" font-family="Public Sans, system-ui, sans-serif" font-size="8.5" fill="#9aa1a5">${esc(E.ejes[1])} ▸</text><circle cx="10" cy="8" r="3" fill="#e9eced"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Esquema ecográfico: ${esc(E.titulo)}"><rect width="${W}" height="${H}" fill="url(#nearfield)"/>${mus}${fas}${bone}${ves}${ner}<rect width="${W}" height="${H}" filter="url(#speckle)" opacity=".5"/>${top}${lab}${ruler}${axes}${E.prof?`<text x="${W-4}" y="10" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#8b9295">cm</text>`:""}</svg>`;
}

const F = id => D.farmacos.find(f => f.id === id);
function pesos(){
  const {peso:w, talla:h, sexo} = S.pac;
  const ideal = Math.max(0, (sexo==="M"?50:45.5) + 0.9*(h-152.4));
  const imc = w / Math.pow(h/100, 2);
  const magro = sexo==="M" ? 9270*w/(6680+216*imc) : 9270*w/(8780+244*imc);
  let dos = w;
  if (S.pac.modo === "ideal") dos = ideal; else if (S.pac.modo === "magro") dos = magro; else if (S.pac.modo === "idealmin") dos = Math.min(w, ideal);
  return { real:w, ideal, magro, imc, dos };
}
function maxMg(fid, epi){ const f = F(fid); const w = pesos().dos; return epi ? Math.min(f.maxCon*w, f.topeCon) : Math.min(f.maxSin*w, f.topeSin); }

  return `<div class="card"><div class="card-h"><h2>Paciente</h2><p>Se usa en la calculadora y en LAST</p></div>

    <div class="field"><label for="pTalla">Talla (cm)</label><input id="pTalla" type="number" inputmode="decimal" min="50" step="1" value="${S.pac.talla}" data-pac="talla"></div>
    <div class="field"><label>Sexo</label><div class="seg" role="group" aria-label="Sexo"><button class="${S.pac.sexo==="F"?"on":""}" data-act="sexo" data-v="F">F</button><button class="${S.pac.sexo==="M"?"on":""}" data-act="sexo" data-v="M">M</button></div></div>
    <div class="field"><label for="pModo">Peso para dosis máxima</label><select id="pModo" data-pac="modo">
      ${[["idealmin","Ideal (o real si es menor)"],["real","Real"],["ideal","Ideal"],["magro","Magro"]].map(([v,l]) => `<option value="${v}" ${S.pac.modo===v?"selected":""}>${l}</option>`).join("")}
    </select></div>
  </div><div class="derived" id="pacOut"></div></div>`;
}

function presList(){ const f = F(S.dil.f); const dl = $("#presList"); if (dl) dl.innerHTML = f.presentaciones.map(x => `<option value="${x}">`).join(""); }
function dilOut(){
  const f = F(S.dil.f), ci = +S.dil.ci, cf = +S.dil.cf, vf = +S.dil.vf, epi = +S.dil.epi;
  if (!(ci > 0) || !(cf > 0) || !(vf > 0)) return `<p class="err">Completa concentración inicial, final y volumen con valores mayores que cero.</p>`;
  if (cf > ci) return `<p class="err">La concentración final (${fmt(cf,3)} %) no puede ser mayor que la inicial (${fmt(ci,3)} %). Revisa los valores.</p>`;
  const v1 = cf * vf / ci, mcg = epi * vf, vEpi = epi ? mcg / 100 : 0, ssn = vf - v1 - vEpi;
  if (ssn < -0.001) return `<p class="err">No queda volumen para la epinefrina diluida: reduce la concentración final o aumenta el volumen.</p>`;
  const mg = cf * 10 * vf, mx = maxMg(f.id, epi > 0), frac = mg / mx;
  const pill = frac > 1 ? `<span class="pill crit">${fmt(frac*100,0)} % del máximo</span>` : frac > .6 ? `<span class="pill warn">${fmt(frac*100,0)} % del máximo</span>` : `<span class="pill ok">${fmt(frac*100,0)} % del máximo</span>`;
  return `<div class="recipe"><div><div class="big">${fmt(v1,1)} mL</div><div class="nota">${esc(f.nombre)} ${fmt(ci,3)} %</div></div><span class="plus">+</span>

    <div><div class="big">${fmt(Math.max(0,ssn),1)} mL</div><div class="nota">SSN 0,9 %</div></div><span class="plus">=</span>
    <div><div class="big">${fmt(vf,1)} mL</div><div class="nota">al ${fmt(cf,3)} % (${fmt(cf*10,2)} mg/mL)</div></div></div>
  <div class="totals"><div>Contiene <b class="mono">${fmt(mg,1)} mg</b> (${fmt(mg/pesos().dos,2)} mg/kg) · máximo para este paciente <b class="mono">${fmt(mx,0)} mg</b> ${pill}</div>
  <button class="btn primary" data-act="dil-plan">Agregar al plan</button></div>
  ${epi ? `<p class="nota" style="margin-top:8px">Epinefrina 100 mcg/mL: 1 mg (1 mL de ampolla 1 mg/mL) + 9 mL de SSN. Total en la jeringa: ${fmt(mcg,0)} mcg.</p>` : ""}`;
}

function planOut(){

  const pct = tot * 100, scale = Math.max(100, pct);
  const pill = pct > 100 ? `<span class="pill crit">Supera el máximo</span>` : pct > 60 ? `<span class="pill warn">Cerca del máximo</span>` : `<span class="pill ok">Dentro del rango</span>`;
  $("#planOut").innerHTML = `<div class="totals"><div><span class="big">${fmt(pct,0)} %</span> <span class="nota">de la dosis máxima acumulada · ${fmt(vol,0)} mL en total</span></div>${pill}</div>

}

function lastOut(){

  D.anatomia.articulaciones.filas.forEach(f => IDX.push({ t:"Inervación: " + f.art, s:"Articulaciones · tema " + f.tema, go:() => nav("articulaciones") }));
  IDX.push({ t:"Calculadora de anestésicos locales", s:"Diluciones y dosis acumulada", go:() => nav("calculadora") });
  IDX.push({ t:"LAST · emulsión lipídica", s:"Toxicidad sistémica", go:() => nav("last") });
  IDX.push({ t:"Anticoagulación", s:"Intervalos ASRA 5.ª ed.", go:() => nav("anticoagulacion") });
  D.farmacos.forEach(f => IDX.push({ t:f.nombre, s:"Anestésico local · máx. " + fmt(f.maxSin) + " mg/kg", go:() => { S.dil.f = f.id; S.dil.ci = f.presentaciones[f.presentaciones.length > 1 ? 1 : 0]; nav("calculadora"); } }));
  D.anticoag.grupos.forEach(g => g.filas.forEach(r => IDX.push({ t:r.f, s:"Anticoagulación · " + r.antes, go:() => { S.acq = r.f.split(" ")[0]; nav("anticoagulacion"); } })));
  D.bloqueos.forEach(b => IDX.push({ t:b.nombre, s:"Bloqueo · " + (b.region||"") + " · tema " + b.tema, k:(b.dermatomas||"") + " " + (b.aka||""), go:() => nav("b-" + b.id) }));
  D.temas.forEach(t => { if (t.estado === "listo" && t.n > 1) IDX.push({ t:t.titulo, s:"Tema " + t.n, go:() => nav("tema-" + t.n) });
    if (t.estado !== "listo") t.bloqueos.forEach(b => IDX.push({ t:b, s:"Bloqueo · tema " + t.n + " (en preparación)", go:() => nav("bloqueos") })); });
}
let pendingNerve = null, pendingLevel = null, hit = 0, found = [];
const qEl = $("#q"), resEl = $("#results");
function doSearch(){
  const q = norm(qEl.value.trim()); if (!q) { resEl.hidden = true; return; }
  const words = q.split(/\s+/);
  found = IDX.map(it => { const hay = norm(it.t + " " + it.s + " " + (it.k||"")); const tt = norm(it.t); if (!words.every(w => hay.includes(w))) return null; return { it, sc: (tt.startsWith(q)?3:0) + (tt.includes(q)?2:0) }; }).filter(Boolean).sort((a,b) => b.sc - a.sc).slice(0,10);
  hit = 0;
  resEl.innerHTML = found.length ? found.map((f,i) => `<button data-i="${i}" class="${i===0?"on":""}">${esc(f.it.t)}<small>${esc(f.it.s)}</small></button>`).join("") : `<div class="nota" style="padding:10px">Sin resultados para "${esc(qEl.value)}".</div>`;
  resEl.hidden = false;
}
function pick(i){ const f = found[i]; if (!f) return; resEl.hidden = true; qEl.value = ""; qEl.blur(); f.it.go(); }
qEl.addEventListener("input", doSearch);
qEl.addEventListener("focus", doSearch);
qEl.addEventListener("keydown", e => {
  if (resEl.hidden) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hit = (hit + (e.key==="ArrowDown"?1:-1) + found.length) % Math.max(1,found.length); [...resEl.querySelectorAll("button")].forEach((b,i) => b.classList.toggle("on", i===hit)); }
  else if (e.key === "Enter") { e.preventDefault(); pick(hit); }
  else if (e.key === "Escape") { resEl.hidden = true; }
});
resEl.addEventListener("mousedown", e => { const b = e.target.closest("button[data-i]"); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) resEl.hidden = true; });

/* ============================== RENDER ============================== */
function render(){
  renderTabs();
  if (pendingNerve) { S.nervio = pendingNerve; pendingNerve = null; }
  if (pendingLevel) { S.nivel = pendingLevel; pendingLevel = null; }
  let html = "";
  if (S.tab === "anatomia") html = viewAnatomia();
  else if (S.tab === "bloqueos") html = viewBloqueos();
  else if (S.tab === "calculadora") html = viewCalc();
  else if (S.tab === "last") html = viewLast();
  else if (S.tab === "anticoagulacion") html = viewAnticoag();
  main.innerHTML = html;
  if (S.tab === "calculadora") { presList(); renderPlan(); updCalc(); }
  if (S.tab === "last") updCalc();
  const acq = $("#acq"); if (acq) acq.addEventListener("input", () => { S.acq = acq.value; $("#acBox").innerHTML = acTables(norm(S.acq)); });
  if (S.nervio && S.tab === "anatomia") { const f = $("#ficha"); if (f && f.getBoundingClientRect().top > innerHeight) f.scrollIntoView({block:"nearest", behavior:"smooth"}); }
}
function rerenderAnat(scrollToFicha){
  const p = plexo(S.sub); if (!p) return;
  if (p.id === "braquial") { const c = $("#bpCard"); if (c) c.outerHTML = braquialCard(p); }
  else if (p.id === "cervical") { const svg = main.querySelector("svg.bp"); if (svg) svg.outerHTML = cervicalSVG(p); }
  $("#rmapBox").innerHTML = rmapHTML(p);
  if (p.id !== "braquial") $("#fichaBox").innerHTML = fichaHTML(p);
  if (scrollToFicha) { const f = $("#ficha"); if (f) { const r = f.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight) f.scrollIntoView({block:"center", behavior:"smooth"}); } }
}

/* ------------------------------ eventos ------------------------------ */
function act(el){
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "nervio") { S.nervio = S.nervio === v ? null : v; rerenderAnat(true); }
  else if (a === "cerrar-ficha") { S.nervio = null; rerenderAnat(); }
  else if (a === "nivel") { S.nivel = S.nivel === v ? null : v; rerenderAnat(); }
  else if (a === "raiz") { S.filtroRaiz = S.filtroRaiz === v ? null : v; $("#rmapBox").innerHTML = rmapHTML(plexo(S.sub)); }
  else if (a === "eco") { S.eco[v] = !S.eco[v]; save(); document.querySelectorAll("[data-eco]").forEach(c => { c.querySelector(".eco").innerHTML = ecoSVG(c.dataset.eco); c.querySelectorAll(".tog").forEach(t => t.setAttribute("aria-pressed", S.eco[t.dataset.v])); }); }
  else if (a === "sexo") { S.pac.sexo = v; save(); document.querySelectorAll('[data-act="sexo"]').forEach(b => b.classList.toggle("on", b.dataset.v === v)); updCalc(); }
  else if (a === "dil-plan") { const f = F(S.dil.f); if (S.ejemplo) { S.plan = []; S.ejemplo = false; } S.plan.push({ b: "Bloqueo " + (S.plan.length+1), f: f.id, c: +S.dil.cf, v: +S.dil.vf, epi: +S.dil.epi > 0 }); save(); renderPlan(); }
  else if (a === "b-calc") { const b = D.bloqueos.find(x => x.id === v); const d = b && b.dosis; if (d) { if (S.ejemplo) { S.plan = []; S.ejemplo = false; } S.plan.push({ b: b.nombre, f: d.f, c: d.c, v: d.v, epi: !!d.epi }); save(); nav("calculadora"); } }
  else if (a === "ir-nivel") { pendingLevel = v; }
  else if (a === "plan-add") { if (S.ejemplo) { S.ejemplo = false; } S.plan.push({ b: "Bloqueo " + (S.plan.length+1), f: "ropi", c: 0.5, v: 10, epi: false }); save(); renderPlan(); }
  else if (a === "plan-del") { S.plan.splice(+v, 1); S.ejemplo = false; save(); renderPlan(); }
  else if (a === "plan-clear") { S.plan = []; S.ejemplo = false; save(); renderPlan(); }
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el) act(el); });
document.addEventListener("error", e => { const f = e.target && e.target.closest && e.target.closest("figure[data-fig]"); if (f) { f.hidden = true; const g = f.parentElement; if (g && ![...g.children].some(c => !c.hidden)) { g.hidden = true; if (g.previousElementSibling) g.previousElementSibling.hidden = true; } } }, true);
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('g[data-act]')) { e.preventDefault(); act(e.target); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.pac) { const k = t.dataset.pac; S.pac[k] = k === "modo" ? t.value : +t.value; document.querySelectorAll(`[data-pac="${k}"]`).forEach(o => { if (o !== t) o.value = t.value; }); save(); updCalc(); }
  else if (t.dataset.dil) { S.dil[t.dataset.dil] = t.dataset.dil === "f" ? t.value : t.value; if (t.dataset.dil === "f") { const f = F(t.value); if (!f.presentaciones.includes(+S.dil.ci)) { S.dil.ci = f.presentaciones[f.presentaciones.length>1?1:0]; $("#dCi").value = S.dil.ci; } presList(); } save(); updCalc(); }
  else if (t.dataset.pl) { const i = +t.closest("tr").dataset.i, k = t.dataset.pl; S.plan[i][k] = k === "epi" ? t.checked : (k === "b" || k === "f") ? t.value : +t.value; S.ejemplo = false; save(); planOut(); }
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset.pl === "epi" || t.dataset.pl === "f" || t.dataset.pac === "modo" || t.dataset.dil) t.dispatchEvent(new Event("input", {bubbles:true})); });

buildIndex();
if (!location.hash) { try { history.replaceState(null, "", "#braquial"); } catch(e) {} }
parseHash();
render();
})();
</script>
</body>
